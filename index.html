<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo Guerra - Portfolio</title>
    <link rel="icon" href="./Assets/icons/icon_principal.ico" type="image/x-icon" style="border-radius: 50%;">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./Assets/css/styles.css">
</head>
<body>
    <h1 class="section-top">
        <div class="theme-switcher">
            <button class="btn-icon" id="btn-theme-toggle" type="button" aria-label="Open theme menu" aria-haspopup="true" aria-controls="theme-menu" aria-expanded="false">
                <i class="bi bi-palette2 icon-glyph" aria-hidden="true"></i>
            </button>
            <div class="theme-menu" id="theme-menu" hidden>
                <button class="theme-option" type="button" data-theme-option="coffee" aria-pressed="true">
                    <span class="theme-option-label">
                        <strong>Coffee</strong>
                        <span>Warm, earthy, current palette</span>
                    </span>
                </button>
                <button class="theme-option" type="button" data-theme-option="cyberpunk" aria-pressed="false">
                    <span class="theme-option-label">
                        <strong>Cyberpunk</strong>
                        <span>Futuristic, purple, neon palette</span>
                    </span>
                </button>
            </div>
        </div>
        <p class="title-welcome">Ricardo Guerra - Portfolio</p>
        <button class="btn-icon" id="btn-config" type="button" aria-label="Open settings">
            <i class="bi bi-sliders icon-glyph" aria-hidden="true"></i>
        </button>
    </h1>

    <main class="section-middle">
        <div class="avatar-container">
            <img src="./Assets/img/myImg.jpeg" alt="Avatar">
        </div>
        <p id="name">Ricardo Guerra</p>
        <p id="name-desc" data-long="description">... description ...</p>
        <div class="main-buttons">
            <button data-long="bio-btn">Bio</button>
            <button data-long="CV">Download CV</button>
            <button data-long="contact-btn">Contact Me</button>
        </div>
        <div class="section-projects">
            <h2 class="separator-projects" data-long="projects">Projects</h2>

                <!--project cards-->
                <div class="projects-grid">
                    <div class="project-card">
                        <img src="./Assets/img/SleepTimeImg.png" alt="SleepTimeImg" class="card-bg">
                        <a href="" class="card-link-overlay" target="_blank" aria-label="Open project"></a>
                        <a href="" class="mini-github-btn" target="_blank" aria-label="Open source">
                            <img src="./Assets/icons/github.png" alt="code">
                        </a>
                        <div class="card-info">
                            <h3>Name project</h3>
                            <p>CSS & React</p>
                        </div>
                    </div>

                    <div class="project-card">
                        <img src="./Assets/img/placeholder.png" alt="placeholder" class="card-bg">
                        <a href="" class="card-link-overlay" target="_blank" aria-label="Open project"></a>
                        <a href="" class="mini-github-btn" target="_blank" aria-label="Open source">
                            <img src="./Assets/icons/github.png" alt="code">
                        </a>
                        <div class="card-info">
                            <h3>Another project</h3>
                            <p>HTML & JS</p>
                        </div>
                    </div>

                    <div class="project-card">
                        <img src="./Assets/img/placeholder.png" alt="placeholder" class="card-bg">
                        <a href="" class="card-link-overlay" target="_blank" aria-label="Open project"></a>
                        <a href="" class="mini-github-btn" target="_blank" aria-label="Open source">
                            <img src="./Assets/icons/github.png" alt="code">
                        </a>
                        <div class="card-info">
                            <h3>Another project</h3>
                            <p>HTML & JS</p>
                        </div>
                    </div>

                    <div class="project-card">
                        <img src="./Assets/img/placeholder.png" alt="placeholder" class="card-bg">
                        <a href="" class="card-link-overlay" target="_blank" aria-label="Open project"></a>
                        <a href="" class="mini-github-btn" target="_blank" aria-label="Open source">
                            <img src="./Assets/icons/github.png" alt="code">
                        </a>
                        <div class="card-info">
                            <h3>Another project</h3>
                            <p>HTML & JS</p>
                        </div>
                    </div>

                    <div class="project-card">
                        <img src="./Assets/img/placeholder.png" alt="placeholder" class="card-bg">
                        <a href="" class="card-link-overlay" target="_blank" aria-label="Open project"></a>
                        <a href="" class="mini-github-btn" target="_blank" aria-label="Open source">
                            <img src="./Assets/icons/github.png" alt="code">
                        </a>
                        <div class="card-info">
                            <h3>Another project</h3>
                            <p>HTML & JS</p>
                        </div>
                    </div>

                    <div class="project-card">
                        <img src="./Assets/img/placeholder.png" alt="placeholder" class="card-bg">
                        <a href="" class="card-link-overlay" target="_blank" aria-label="Open project"></a>
                        <a href="" class="mini-github-btn" target="_blank" aria-label="Open source">
                            <img src="./Assets/icons/github.png" alt="code">
                        </a>
                        <div class="card-info">
                            <h3>Another project</h3>
                            <p>HTML & JS</p>
                        </div>
                    </div>
                </div>

        </div>
    </main>
    <div class="section-contacts">
        <h3 data-long="contact">Contact Me</h3>
        <div class="bmc-container">
            <a class="bmc-button" href="https://www.buymeacoffee.com/guerra14" target="_blank" rel="noopener noreferrer" aria-label="Buy me a coffee">
                <i class="bi bi-cup-hot icon-glyph icon-coffee" aria-hidden="true"></i>
                <span>Buy me a coffee</span>
            </a>
        </div>
        <div class="contacts-container">
            <button class="btn-icon" type="button" aria-label="GitHub">
                <i class="bi bi-github icon-glyph" aria-hidden="true"></i>
            </button>
            <button class="btn-icon" type="button" aria-label="Instagram">
                <i class="bi bi-instagram icon-glyph" aria-hidden="true"></i>
            </button>
            <button class="btn-icon" type="button" aria-label="Email">
                <i class="bi bi-envelope icon-glyph" aria-hidden="true"></i>
            </button>
            <button class="btn-icon" type="button" aria-label="LinkedIn">
                <i class="bi bi-linkedin icon-glyph" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <script src="./Assets/js/script.js"></script>
</body>
